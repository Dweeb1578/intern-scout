[project]
name = "internscout"
version = "0.1.0"
description = "Find internships that match what you want to do."
requires-python = ">=3.11"
dependencies = [
    "scrapling>=0.2",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
internscout = "internscout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
